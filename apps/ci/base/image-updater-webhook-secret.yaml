# Shared secret the Argo CD Image Updater webhook endpoint expects as a query
# parameter. Must match the value the controller is started with in
# QUAY_WEBHOOK_SECRET (sourced from QUAY_WEBHOOK in the cluster secret store).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: petclinic
  target:
    name: image-updater-webhook
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: QUAY_WEBHOOK
