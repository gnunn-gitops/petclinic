apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    # Tekton copies task annotations onto the TaskRun pod. CRI-O reads this one
    # and exposes the two devices rootless podman needs: /dev/net/tun so that
    # pasta can give each nested container its own network namespace, and
    # /dev/fuse so that fuse-overlayfs can be used instead of the much slower
    # vfs storage driver.
    io.kubernetes.cri-o.Devices: "/dev/fuse,/dev/net/tun"
  name: maven
spec:
  description: >-
    Runs a Maven build alongside a rootless podman sidecar so that tests using
    Testcontainers can start nested containers.

    The TaskRun must be run with a pod template that sets "hostUsers: false" and
    with a service account bound to an SCC that requires a pod level user
    namespace and allows the SETUID and SETGID capabilities, such as the
    OpenShift provided "nested-container" SCC. See scc-rolebinding.yaml.

    Only the podman sidecar is granted those capabilities, the maven step itself
    runs with the default restricted capability set and simply talks to the
    podman socket over DOCKER_HOST.
  params:
    - name: GOALS
      description: The maven goals to run.
      type: array
      default:
        - package
    - name: SUBDIRECTORY
      description: The subdirectory within the source workspace holding the maven project.
      type: string
      default: ""
    - name: MAVEN_IMAGE
      description: Image providing the JDK and maven. Red Hat supported, no custom build required.
      type: string
      default: registry.redhat.io/ubi9/openjdk-21:latest
    - name: PODMAN_IMAGE
      description: Image providing podman. Ships a "podman" user (uid 1000) with subuid/subgid ranges and file capabilities on newuidmap/newgidmap, which is what rootless nested containers need.
      type: string
      default: registry.redhat.io/rhel9/podman:latest
  workspaces:
    - name: source
      description: The workspace holding the maven project.
    - name: maven-repository
      description: Workspace used as the local maven repository, allowing it to be cached between runs.
  steps:
    - name: maven-goals
      image: $(params.MAVEN_IMAGE)
      workingDir: $(workspaces.source.path)/$(params.SUBDIRECTORY)
      command:
        - /usr/bin/mvn
      args:
        - -B
        - -Dmaven.repo.local=$(workspaces.maven-repository.path)/repository
        - $(params.GOALS[*])
      env:
        - name: HOME
          value: /tekton/home
        # Testcontainers talks to the podman sidecar over the shared socket.
        - name: DOCKER_HOST
          value: unix:///var/run/podman/podman.sock
        # Ryuk needs to mount the container socket into a container of its own,
        # which rootless podman in a user namespace will not allow.
        - name: TESTCONTAINERS_RYUK_DISABLED
          value: "true"
      computeResources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeMounts:
        - name: podman-socket
          mountPath: /var/run/podman
  sidecars:
    - name: podman
      image: $(params.PODMAN_IMAGE)
      env:
        - name: HOME
          value: /home/podman
        - name: CONTAINERS_CONF_OVERRIDE
          value: /tmp/containers-override.conf
      # Supplied as args rather than command so that the image entrypoint is
      # left intact. Tekton shuts a sidecar down by swapping in its "nop"
      # image, which only works if its own entrypoint still runs.
      args:
        - /bin/bash
        - -c
        - |
          set -e
          # The Red Hat podman image ships a containers.conf tuned for running
          # podman as a nested engine on the host network, which leaves
          # containers it starts with no published ports. Testcontainers needs
          # the published ports, so give each container its own network
          # namespace. Everything else in the shipped config is left alone.
          #
          # This works because OpenShift Pipelines adds the
          # "io.kubernetes.cri-o.Devices: /dev/fuse,/dev/net/tun" annotation to
          # TaskRun pods, so pasta (i.e. rootless user-mode networking in podman) can
          # set up the tap device and podman can use
          # fuse-overlayfs rather than falling back to the much slower vfs
          # storage driver.
          cat > "${CONTAINERS_CONF_OVERRIDE}" <<'EOF'
          [containers]
          netns = "private"
          EOF
          exec podman system service --time=0 unix:///var/run/podman/podman.sock
      securityContext:
        runAsUser: 1000
        capabilities:
          add:
            - SETGID
            - SETUID
          drop:
            - ALL
        # Lets podman call the setcap'd newuidmap/newgidmap to create the
        # nested user namespace each container runs in.
        allowPrivilegeEscalation: true
        # Required so that podman can mount /proc inside nested containers.
        procMount: Unmasked
      computeResources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: podman-socket
          mountPath: /var/run/podman
        - name: podman-storage
          mountPath: /home/podman/.local/share/containers
  volumes:
    - name: podman-socket
      emptyDir: {}
    - name: podman-storage
      emptyDir: {}
