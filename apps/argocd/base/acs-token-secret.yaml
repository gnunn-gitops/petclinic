apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    promoter.argoproj.io/webrequestcommitstatus-access: allowed
  name: acs-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: petclinic
  data:
    - secretKey: token
      remoteRef:
        key: ACS_TOKEN
