apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    promoter.argoproj.io/webrequestcommitstatus-access: allowed
  name: github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: petclinic
  target:
    name: github
    template:
      metadata:
        annotations:
          tekton.dev/git-0: https://github.com
      type: kubernetes.io/basic-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: GITHUB
