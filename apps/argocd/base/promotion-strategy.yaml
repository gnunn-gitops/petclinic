apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: petclinic
spec:
  activeCommitStatuses:
    - key: argocd-health-petclinic
    - key: acs-policy-violation
  environments:
  - autoMerge: true
    branch: environment/dev
  - autoMerge: false
    branch: environment/stage
  - autoMerge: false
    branch: environment/prod
  gitRepositoryRef:
    name: petclinic
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: ArgoCDCommitStatus
metadata:
  name: petclinic
spec:
  key: argocd-health-petclinic
  promotionStrategyRef:
    name: petclinic
  applicationSelector:
    matchLabels:
      app: petclinic
