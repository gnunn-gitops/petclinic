apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: acs-policy-violation
spec:
  promotionStrategyRef:
    name: petclinic
  key: acs-policy-violation
  reportOn: active
  descriptionTemplate: 'critical: {{ index .SuccessVariables "critical" }}, high: {{ index .SuccessVariables "high" }}, medium: {{ index .SuccessVariables "medium" }}, low: {{ index .SuccessVariables "low" }}'
  urlTemplate: https://central-rhacs-operator.apps.hub.ocplab.com/main/violations?filteredWorkflowView=Applications%20view&violationState=ACTIVE&s[Namespace][0]=%22petclinic-{{ .Branch | splitList "/" | last }}%22
  httpRequest:
    urlTemplate: https://central-rhacs-operator.apps.hub.ocplab.com/v1/alerts?query=Namespace%3Apetclinic-{{ .Branch | splitList "/" | last }}%2BPlatform%20Component%3Afalse%2BEntity%20Type%3ADEPLOYMENT%2BViolation%20State%3AACTIVE
    methodTemplate: GET
    timeout: 30s
    authentication:
      bearer:
        secretRef:
          name: acs-api-token
  success:
    when:
      variables:
        expression: |
          let prev = SuccessOutput ?? {
            status: "Pending",
            critical: 0,
            high: 0,
            medium: 0,
            low: 0,
          };
          Response != nil ?
            Response.StatusCode == 200 ?
              {
                critical: count(Response.Body.alerts, .policy.severity=="CRITICAL_SEVERITY"),
                high: count(Response.Body.alerts, .policy.severity=="HIGH_SEVERITY"),
                medium: count(Response.Body.alerts, .policy.severity=="MEDIUM_SEVERITY"),
                low: count(Response.Body.alerts, .policy.severity=="LOW_SEVERITY"),
                total: len(Response.Body.alerts),
                status: "Success"
              } :
              {
                status: "Failed (" + Response.StatusCode + ")",
                critical: 0,
                high: 0,
                medium: 0,
                low: 0,
              }
           : prev
      expression: |
        Variables.status == "Success" && Variables.critical == 0
      output:
        expression: "Variables"
  mode:
    context: environments
    polling:
      interval: 2m
