apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: acs-policy-violation
spec:
  promotionStrategyRef:
    name: petclinic
  key: acs-policy-violation
  reportOn: active
  descriptionTemplate: 'ACS Policies (completed: {{ index .SuccessVariables "success" }}, critical: {{ index .SuccessVariables "critical" }}, high: {{ index .SuccessVariables "high" }} ) '
  httpRequest:
    urlTemplate: https://central-rhacs-operator.apps.hub.ocplab.com/v1/alerts?query=Namespace:petclinic-{{ .Branch | splitList "/" | last }}
    methodTemplate: GET
    timeout: 30s
    authentication:
      bearer:
        secretRef:
          name: acs-api-token
  success:
    when:
      variables:
        expression: |
          let default = {
            success: false,
            critical: "NA",
            high: "NA",
            medium: "NA",
            low: "NA",
          };
          Response != nil ? {
            critical: count(Response.Body.alerts, .policy.severity=="CRITICAL_SEVERITY"),
            high: count(Response.Body.alerts, .policy.severity=="HIGH_SEVERITY"),
            medium: count(Response.Body.alerts, .policy.severity=="MEDIUM_SEVERITY"),
            low: count(Response.Body.alerts, .policy.severity=="LOW_SEVERITY"),
            total: len(Response.Body.alerts),
            success: Response.StatusCode == 200
          } : default
      expression: "Variables.success"
      output:
        expression: 'Variables'
  mode:
    context: promotionstrategy
    polling:
      interval: 5m
