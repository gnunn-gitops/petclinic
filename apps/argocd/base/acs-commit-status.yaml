apiVersion: promoter.argoproj.io/v1alpha1
kind: WebRequestCommitStatus
metadata:
  name: acs-policy-violation
spec:
  promotionStrategyRef:
    name: petclinic
  key: acs-policy-violation
  reportOn: active
  descriptionTemplate: 'Validating ACS Policies ({{ .Phase }}) for {{ index .TriggerVariables "currentSha" }}'
  httpRequest:
    urlTemplate: https://central-rhacs-operator.apps.hub.ocplab.com/v1/alerts?query=Namespace:petclinic-dev+Violation%20State:ACTIVE
    methodTemplate: GET
    timeout: 30s
    authentication:
      bearer:
        secretRef:
          name: acs-api-token
  success:
    when:
      expression: >-
        Response != nil && Response.Body != nil  ? (Response.StatusCode == 200 && size(Response.Body.alerts) == 0) : Phase == "success"
  mode:
    context: promotionstrategy
    polling:
      interval: 5m
