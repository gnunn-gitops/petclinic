apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: petclinic
spec:
  progressDeadlineSeconds: 600
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: petclinic
  strategy:
    canary:
      dynamicStableScale: true
      canaryService: petclinic-canary
      stableService: petclinic-stable
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
              - petclinic
      steps:
      - setWeight: 20
      - pause: {duration: 10}
      - setWeight: 80
      - pause: {duration: 10}
      - setWeight: 100
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
      labels:
        app: petclinic
        deployment: petclinic
    spec:
      containers:
      - image: quay.io/gnunn/quarkus-petclinic:latest
        imagePullPolicy: Always
        env:
          - name: QUARKUS_DATASOURCE_JDBC_URL
            value: jdbc:postgresql://petclinic-db:5432/petclinic
          - name: QUARKUS_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                key: database-user
                name: petclinic-db
          - name: QUARKUS_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: database-password
                name: petclinic-db
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
        name: petclinic
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
