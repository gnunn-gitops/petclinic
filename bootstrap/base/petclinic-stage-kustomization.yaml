apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: petclinic-stage
  labels:
    app: petclinic
    env: stage
spec:
  interval: 1m
  url: https://github.com/gnunn-gitops/petclinic-flux.git
  ref:
    branch: environment/stage
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: petclinic-stage
  labels:
    app: petclinic
    env: stage
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: petclinic-stage
  path: ./
  targetNamespace: petclinic-stage
