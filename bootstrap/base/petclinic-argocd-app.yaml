apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    cluster-name: hub-prod-local
    promoter.argoproj.io/has-promotionstrategy: "true"
  name: petclinic-argocd
spec:
  destination:
    name: hub-prod-local
    namespace: petclinic-argocd
  project: petclinic
  source:
    path: apps/argocd/overlays/single-ps
    repoURL: https://github.com/gnunn-gitops/petclinic.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
