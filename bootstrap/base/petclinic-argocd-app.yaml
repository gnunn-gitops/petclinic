apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    cluster-name: hub-prod-local
    promoter.argoproj.io/has-promotionstrategy: "true"
  name: petclinic-promoter
spec:
  destination:
    name: hub-prod-local
    namespace: petclinic-promoter
  project: petclinic
  source:
    path: apps/argocd/base
    repoURL: https://github.com/gnunn-gitops/petclinic-flux.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
