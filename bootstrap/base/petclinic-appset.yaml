apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: petclinic
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/gnunn-gitops/petclinic.git
      revision: HEAD
      directories:
      - path: environments/overlays/*
      values:
        repoURL: https://github.com/gnunn-gitops/petclinic.git
        destination: workload-prod-local
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated
  template:
    metadata:
      labels:
        argocd-agent: 'true'
        cluster-name: '{{ .values.destination }}'
        env: '{{.path.basename}}'
        app: petclinic
      name: petclinic-{{.path.basename}}
    spec:
      project: "petclinic"
      source:
        repoURL: '{{.values.repoURL}}'
        targetRevision: "environment/{{.path.basename}}"
        path: '.'
      destination:
        name: '{{ .values.destination }}'
        namespace: petclinic-{{.path.basename}}
      syncPolicy:
        automated:
          enabled: true
          selfHeal: true
