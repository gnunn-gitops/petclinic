name: Validate Image
on:
  pull_request:
    branches:
      - "environment/prod"
      - "environment/stage"
      - "environment/dev"
      - "main"

  push:
    branches:
      - "main"

jobs:
  validate-image:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Get Image
        id: get-image
        run: |
          export PETCLINIC_IMAGE_URL=$(kustomize build apps/petclinic/base | yq '. | select(.kind == "Rollout" and .metadata.name == "petclinic") | .spec.template.spec.containers[].image' | tr -d '"')
          PETCLINIC_TAG=$(echo -n "${PETCLINIC_IMAGE_URL##*:}")
          echo "Testing image: $PETCLINIC_IMAGE_URL"
          echo "Testing tag: $PETCLINIC_TAG"
          echo -n "petclinic_tag=$PETCLINIC_TAG" >> $GITHUB_OUTPUT
      - name: Wait for Quay.io Security Scan to Complete
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_IO }}
          # Format: organization/repository or username/repository
          REPO_PATH: "gnunn/quarkus-petclinic"
          # Use either the Image Tag (e.g., v1.0.0) or the SHA Digest
          IMAGE_REF: "${{ steps.get-image.outputs.petclinic_tag }}"
        run: |
          echo "Checking Quay.io security scan status for ${REPO_PATH}:${IMAGE_REF}..."

          TIMEOUT=600 # Max wait time in seconds (10 minutes)
          INTERVAL=15 # Time to wait between retries
          ELAPSED=0
          STATUS="queued"

          while [[ "$STATUS" != "scanned" ]]; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "::error::Timed out waiting for Quay security scan to complete after ${TIMEOUT} seconds."
              exit 1
            fi

            # Query Quay API for the specific manifest security status
            RESPONSE=$(curl -s -H "Authorization: Bearer $QUAY_TOKEN" \
              "https://quay.io/{REPO_PATH}/manifest/${IMAGE_REF}/security?vulnerabilities=true")

            # Extract the status field using jq
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "queued"')

            if [[ "$STATUS" == "scanned" ]]; then
              echo "Quay security scan complete!"
              break
            elif [[ "$STATUS" == "failed" ]]; then
              echo "::error::Quay security scanner reported a failed index status."
              exit 1
            else
              echo "Current scan status: [${STATUS}]. Retrying in ${INTERVAL} seconds... (${ELAPSED}/${TIMEOUT}s)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            fi
          done
      - name: Run Quay Vulnerability Check
        uses: atilsensalduz/quay-image-vulnerability-check-action@v0.9.0
        with:
          organization: gnunn
          repository: quarkus-petclinic
          image_tag: ${{ steps.get-image.outputs.petclinic_tag }}
          quay_token: ${{ secrets.QUAY_IO }}
          #severities: "High, Critical"
          severities: "Critical"
          exit_code: "1"

      - name: Generate Report on Action Summary
        if: always()
        run: |
          cat vulnerabilities_report.md >> $GITHUB_STEP_SUMMARY
