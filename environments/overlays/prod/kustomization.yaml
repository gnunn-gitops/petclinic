apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: petclinic-prod

resources:
  - ../../../apps/petclinic-db/base
  - ../../../apps/petclinic/base

patches:
  - patch: |
      - op: replace
        path: /spec/strategy/canary/steps/1/analysis/args/2/value
        value: https://petclinic-canary-petclinic-prod.apps.home.ocplab.com/
    target:
      kind: Rollout
      name: petclinic
