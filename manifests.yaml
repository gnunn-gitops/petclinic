apiVersion: v1
kind: Service
metadata:
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
  name: petclinic-canary
  namespace: petclinic-stage
spec:
  ports:
  - name: 8080-tcp
    port: 8080
  - name: 8443-tcp
    port: 8443
  selector:
    app: petclinic
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: petclinic-db
    app.kubernetes.io/component: petclinic-db
    app.kubernetes.io/instance: petclinic-db
    app.kubernetes.io/name: petclinic-db
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: postgresql
  name: petclinic-db
  namespace: petclinic-stage
spec:
  ports:
  - name: petclinic-db
    port: 5432
  selector:
    name: petclinic-db
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
  name: petclinic-stable
  namespace: petclinic-stage
spec:
  ports:
  - name: 8080-tcp
    port: 8080
  - name: 8443-tcp
    port: 8443
  selector:
    app: petclinic
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: petclinic-db
    app.kubernetes.io/component: petclinic-db
    app.kubernetes.io/instance: petclinic-db
    app.kubernetes.io/name: petclinic-db
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: postgresql
  name: petclinic-db
  namespace: petclinic-stage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: petclinic-db
    app.kubernetes.io/component: petclinic-db
    app.kubernetes.io/instance: petclinic-db
    app.kubernetes.io/name: petclinic-db
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: postgresql
  name: petclinic-db
  namespace: petclinic-stage
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: petclinic-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: petclinic-db
        app.kubernetes.io/component: petclinic-db
        app.kubernetes.io/instance: petclinic-db
        app.kubernetes.io/name: petclinic-db
        app.kubernetes.io/part-of: petclinic
        app.openshift.io/runtime-icon: postgresql
        name: petclinic-db
    spec:
      containers:
      - env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: petclinic-db
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: petclinic-db
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              key: database-name
              name: petclinic-db
        image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /usr/libexec/check-container
            - --live
          failureThreshold: 3
          initialDelaySeconds: 120
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: postgresql
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /usr/libexec/check-container
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 1Gi
        securityContext:
          privileged: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: postgresql-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: petclinic-db
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
  name: petclinic
  namespace: petclinic-stage
spec:
  progressDeadlineSeconds: 600
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: petclinic
  strategy:
    canary:
      canaryService: petclinic-canary
      dynamicStableScale: true
      stableService: petclinic-stable
      steps:
      - setWeight: 20
      - pause:
          duration: 10
      - setWeight: 80
      - pause:
          duration: 10
      - setWeight: 100
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - petclinic
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
      labels:
        app: petclinic
    spec:
      containers:
      - env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: jdbc:postgresql://petclinic-db:5432/petclinic
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: database-user
              name: petclinic-db
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: petclinic-db
        image: quay.io/gnunn/quarkus-petclinic:a2bdaba-3HCA8KOSYGBprpf67vg2fh1CuQ9
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
        name: petclinic
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app: petclinic-db
    app.kubernetes.io/component: petclinic-db
    app.kubernetes.io/instance: petclinic-db
    app.kubernetes.io/name: petclinic-db
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: postgresql
  name: petclinic-db
  namespace: petclinic-stage
spec:
  dataFrom:
  - extract:
      key: PETCLINIC_DB
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: petclinic
  target:
    creationPolicy: Owner
    name: petclinic-db
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/disable_cookies: "true"
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
  name: petclinic
  namespace: petclinic-stage
spec:
  alternateBackends:
  - kind: Service
    name: petclinic-canary
    weight: 0
  port:
    targetPort: 8080-tcp
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: petclinic-stable
    weight: 100
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
  name: petclinic-canary
  namespace: petclinic-stage
spec:
  port:
    targetPort: 8080-tcp
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: petclinic-canary
