apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: petclinic-db
    app.kubernetes.io/component: petclinic-db
    app.kubernetes.io/instance: petclinic-db
    app.kubernetes.io/name: petclinic-db
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: postgresql
  name: petclinic-db
  namespace: petclinic-prod
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      name: petclinic-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: petclinic-db
        app.kubernetes.io/component: petclinic-db
        app.kubernetes.io/instance: petclinic-db
        app.kubernetes.io/name: petclinic-db
        app.kubernetes.io/part-of: petclinic
        app.openshift.io/runtime-icon: postgresql
        name: petclinic-db
    spec:
      containers:
      - env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              key: database-user
              name: petclinic-db
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: petclinic-db
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              key: database-name
              name: petclinic-db
        image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /usr/libexec/check-container
            - --live
          failureThreshold: 3
          initialDelaySeconds: 120
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        name: postgresql
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /usr/libexec/check-container
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 1Gi
        securityContext:
          privileged: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: postgresql-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      volumes:
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: petclinic-db
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
    test-trigger: "20260819113906"
  name: smoke-test
  namespace: petclinic-prod
spec:
  args:
  - name: namespace
  - name: route-name
  - name: route-url
  - name: api-token
    valueFrom:
      secretKeyRef:
        key: token
        name: monitor-auth-secret
  metrics:
  - count: 3
    failureLimit: 0
    interval: 20s
    name: success-rate
    provider:
      prometheus:
        address: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        headers:
        - key: Authorization
          value: Bearer {{args.api-token}}
        insecure: true
        query: |
          irate(haproxy_backend_http_responses_total{exported_namespace='{{ args.namespace }}', route=~"{{ args.route-name }}", code="5xx"}[1m]) > 5 or on() vector(0)
        timeout: 40
    successCondition: result[0] == 0
  - name: run-load
    provider:
      job:
        spec:
          backoffLimit: 1
          template:
            spec:
              containers:
              - args:
                - siege -c 20 -d5 -t2M -v http://{{args.route-url}}
                command:
                - sh
                - -c
                image: quay.io/gnunn/tools:latest
                name: siege
              restartPolicy: Never
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app: petclinic
    app.kubernetes.io/component: petclinic
    app.kubernetes.io/instance: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: petclinic
    app.openshift.io/runtime-icon: quarkus
    signer: ocplab
    test-trigger: "20260819113906"
  name: petclinic
  namespace: petclinic-prod
spec:
  progressDeadlineSeconds: 600
  replicas: 4
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: petclinic
  strategy:
    canary:
      canaryService: petclinic-canary
      dynamicStableScale: true
      stableService: petclinic-stable
      steps:
      - setWeight: 20
      - analysis:
          args:
          - name: namespace
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: route-name
            value: petclinic-canary
          - name: route-url
            value: https://petclinic-canary-petclinic-prod.apps.home.ocplab.com/
          templates:
          - templateName: smoke-test
      - setWeight: 100
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - petclinic
  template:
    metadata:
      annotations:
        openshift.io/generated-by: OpenShiftWebConsole
      labels:
        app: petclinic
        signer: ocplab
    spec:
      containers:
      - env:
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: jdbc:postgresql://petclinic-db:5432/petclinic
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              key: database-user
              name: petclinic-db
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: database-password
              name: petclinic-db
        image: quay.io/gnunn/quarkus-petclinic:3dacfc6-3IVHgnpmHADh8iR26mdmUSPKDzg
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
        name: petclinic
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
---
